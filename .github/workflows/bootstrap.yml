name: Materialize Clonegrown bootstrap

on:
  push:
    branches: [bootstrap-v0]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-v0
          fetch-depth: 0

      - name: Reconstruct and verify hardened v0
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            echo 'Bootstrap payload already materialized.'
            exit 0
          fi

          cat .bootstrap/payload.b64.* | base64 -d > /tmp/clonegrown-publish-noresults.tar.xz
          (cd /tmp && sha256sum -c "$GITHUB_WORKSPACE/.bootstrap/ARCHIVE.SHA256")
          tar -xJf /tmp/clonegrown-publish-noresults.tar.xz -C .
          sha256sum -c .bootstrap/SHA256SUMS
          python3 -m py_compile clonegrown.py clonegrown_core.py clonegrown_state.py clonegrown_repo.py clonegrown_worker.py clonegrown_ops.py
          python3 clonegrown.py --help >/dev/null

      - name: Commit verified project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md SKILL.md pyproject.toml clonegrown.py clonegrown_core.py clonegrown_state.py clonegrown_repo.py clonegrown_worker.py clonegrown_ops.py tests research
          git rm -r -- .bootstrap
          git commit -m 'Materialize hardened Clonegrown v0'
          git push origin HEAD:bootstrap-v0
