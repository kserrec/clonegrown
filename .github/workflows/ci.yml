name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q clonegrown tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installer syntax
        run: sh -n install.sh
      - name: Package smoke test
        run: |
          python -m pip install .
          clonegrown --version
          clonegrown --help
          python -m clonegrown --help

  hardening:
    strategy:
      matrix:
        mode: [clone, worktree]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial suite (${{ matrix.mode }} workers)
        run: python tests/campaign/hardening_suite.py
        env:
          CWS_SUITE_MODE: ${{ matrix.mode }}
          CWS_RESULTS_PATH: ${{ runner.temp }}/hardening-${{ matrix.mode }}.json
