name: CI

on:
  push:
    branches: [main, bootstrap-v0]
    paths-ignore:
      - '.github/ci-verified'
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile clonegrown*.py
      - name: CLI tests
        run: python -m unittest tests.test_cli -v
      - name: Installer syntax
        run: sh -n install.sh
      - name: Package smoke test
        run: |
          python -m pip install .
          clonegrown --help

  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing adversarial suite
        run: python tests/hardening_suite.py

  record-bootstrap-success:
    if: github.ref == 'refs/heads/bootstrap-v0'
    needs: [test, hardening]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-v0
      - name: Record verified source SHA
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERIFIED_SHA" > .github/ci-verified
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/ci-verified
          git commit -m 'Record verified bootstrap SHA [skip ci]'
          git push origin HEAD:bootstrap-v0
