name: CI

on:
  push:
    branches: [main, bootstrap-v0]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile clonegrown*.py
      - name: CLI tests
        run: python -m unittest tests.test_cli -v
      - name: Installer syntax
        run: sh -n install.sh
      - name: Package smoke test
        run: |
          python -m pip install .
          clonegrown --help

  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing adversarial suite
        run: python tests/hardening_suite.py
