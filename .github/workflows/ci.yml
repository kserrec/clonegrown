name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: POSIX unit/destructive (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: ${{ matrix.python == '3.x' }}
      - name: Compile
        run: python -m compileall -q clonegrown tests
      # The full suite includes installer replacement, lease, quarantine,
      # worktree cleanup, and real parent-interruption destructive paths.
      - name: Unit tests, including destructive paths
        run: python -m unittest discover -s tests -v
      - name: Installer syntax
        run: sh -n install.sh
      - name: Package smoke test
        run: |
          python -m pip install .
          clonegrown --version
          clonegrown --help
          python -m clonegrown --help

  minimum-git:
    name: Exact minimum Git 2.29.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned Git 2.29.0
        shell: bash
        env:
          MINIMUM_GIT_VERSION: 2.29.0
          MINIMUM_GIT_SHA256: 28432d995257c4626fe0fb2091f588df6eed98e9571419e72c83bc23372e6b89
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-$MINIMUM_GIT_VERSION.tar.xz"
          source_dir="$RUNNER_TEMP/git-$MINIMUM_GIT_VERSION"
          install_dir="$RUNNER_TEMP/git-$MINIMUM_GIT_VERSION-install"
          curl -fsSLo "$archive" \
            "https://www.kernel.org/pub/software/scm/git/git-$MINIMUM_GIT_VERSION.tar.xz"
          echo "$MINIMUM_GIT_SHA256  $archive" | sha256sum -c -
          tar --exclude='.env' --exclude='*.env' --exclude='.env.*' --exclude='*.env.*' \
            -xf "$archive" -C "$RUNNER_TEMP"
          make -C "$source_dir" -j2 prefix="$install_dir" \
            NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease NO_CURL=YesPlease
          make -C "$source_dir" prefix="$install_dir" \
            NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease NO_CURL=YesPlease install
          test "$("$install_dir/bin/git" --version)" = "git version $MINIMUM_GIT_VERSION"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          echo "CLONEGROWN_GIT=$install_dir/bin/git" >> "$GITHUB_ENV"
      - name: Prove the exact Git is active
        run: |
          test "$(git --version)" = 'git version 2.29.0'
          test "$("$CLONEGROWN_GIT" --version)" = 'git version 2.29.0'
      - name: Unit tests with Git 2.29.0
        run: python -m unittest discover -s tests -v
      - name: Adversarial suites with Git 2.29.0
        run: |
          CWS_TEST_ROOT="${{ runner.temp }}/minimum-git-clone" \
            CWS_RESULTS_PATH="${{ runner.temp }}/minimum-git-clone.json" \
            CWS_SUITE_MODE=clone python tests/campaign/hardening_suite.py
          CWS_TEST_ROOT="${{ runner.temp }}/minimum-git-worktree" \
            CWS_RESULTS_PATH="${{ runner.temp }}/minimum-git-worktree.json" \
            CWS_SUITE_MODE=worktree python tests/campaign/hardening_suite.py

  hardening:
    strategy:
      fail-fast: false
      matrix:
        mode: [clone, worktree]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial suite (${{ matrix.mode }} workers)
        run: python tests/campaign/hardening_suite.py
        env:
          CWS_SUITE_MODE: ${{ matrix.mode }}
          CWS_RESULTS_PATH: ${{ runner.temp }}/hardening-${{ matrix.mode }}.json
      - name: Retain hardening result (${{ matrix.mode }} workers)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hardening-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hardening-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30
