name: Export current branch

on:
  push:
    branches: [bootstrap-v0]
    paths:
      - '.github/workflows/export-current.yml'
      - '.export-trigger'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-v0
          fetch-depth: 0
      - name: Export repository into temporary text chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .export
          mkdir .export
          tar --exclude=.git --exclude=.export --exclude=.export-trigger -czf /tmp/clonegrown-bootstrap-v0.tar.gz .
          sha256sum /tmp/clonegrown-bootstrap-v0.tar.gz | sed 's#/tmp/##' > .export/SHA256
          base64 -w0 /tmp/clonegrown-bootstrap-v0.tar.gz | split -b 50000 -d -a 3 - .export/payload.b64.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .export
          git commit -m 'Export bootstrap-v0 for local finalization'
          git push origin HEAD:bootstrap-v0
