[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "clonegrown"
dynamic = ["version"]
description = "Git worker lifecycle management for coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
clonegrown = "clonegrown.cli:main"

[project.urls]
Homepage = "https://github.com/kserrec/clonegrown"
Repository = "https://github.com/kserrec/clonegrown"

[tool.setuptools]
packages = ["clonegrown"]

[tool.setuptools.dynamic]
version = {attr = "clonegrown.__version__"}
