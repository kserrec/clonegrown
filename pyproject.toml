[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clonegrown"
dynamic = ["version"]
description = "Git worker lifecycle management for coding agents"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
clonegrown = "clonegrown.cli:main"

[project.urls]
Homepage = "https://github.com/kserrec/clonegrown"
Repository = "https://github.com/kserrec/clonegrown"

[tool.setuptools]
packages = ["clonegrown"]

[tool.setuptools.dynamic]
version = {attr = "clonegrown.__version__"}
